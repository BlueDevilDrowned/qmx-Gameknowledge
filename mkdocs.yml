site_name: 游戏知识库
site_description: 由工作室共同维护的游戏开发、设计与运营知识库
site_url: https://bluedevildrowned.github.io/qmx-Gameknowledge/
repo_url: https://github.com/BlueDevilDrowned/qmx-Gameknowledge
repo_name: BlueDevilDrowned/qmx-Gameknowledge
edit_uri: edit/main/docs/

theme:
  name: material
  language: zh
  features:
    - navigation.instant
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.action.edit
    - content.action.view
    - content.code.copy
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-sunny
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-night
        name: 切换到浅色模式
  font:
    text: Noto Sans SC
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github

plugins:
  - search:
      lang: zh
  - blog:
      blog_dir: blog
      post_dir: "{blog}/posts"
      post_date_format: long
      post_url_format: "{date}/{slug}"
      archive: true
      archive_name: 归档
      categories: true
      categories_name: 分类
      pagination: true
      pagination_per_page: 10
      authors_file: "{blog}/.authors.yml"
  - tags:

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.emoji
  - pymdownx.highlight:
      anchor_linenums: true
      line_anchors: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

nav:
  - 首页: index.md
  - 知识库:
      - 使用说明: guide/usage.md
  - 博客:
      - 文章: blog/index.md
      - 标签: blog/tags.md
  - 关于:
      - 贡献指南: https://github.com/BlueDevilDrowned/qmx-Gameknowledge/blob/main/CONTRIBUTING.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/BlueDevilDrowned/qmx-Gameknowledge
      name: GitHub 仓库
  generator: false

extra_css:
  - stylesheets/extra.css

copyright: Copyright &copy; 2026 工作室知识库






